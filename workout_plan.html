<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f1117; color: #e2e8f0; padding: 20px; direction: rtl; }
  h1 { text-align: center; font-size: 1.3rem; color: #34d399; margin-bottom: 4px; }
  .subtitle { text-align: center; font-size: 0.78rem; color: #64748b; margin-bottom: 18px; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 20px; border: 1px solid #334155; background: transparent; color: #94a3b8; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
  .tab.active { background: #34d399; color: #0f1117; border-color: #34d399; font-weight: 700; }
  .section { display: none; }
  .section.active { display: block; }
  .day-grid { display: flex; flex-direction: column; gap: 12px; }
  .day-card { background: #1e2535; border-radius: 14px; overflow: hidden; border: 1px solid #2d3748; }
  .day-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; }
  .day-badge { font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 10px; }
  .day-name { font-size: 0.9rem; font-weight: 600; flex: 1; }
  .day-type { font-size: 0.72rem; color: #94a3b8; }
  .day-toggle { color: #64748b; font-size: 0.8rem; transition: transform 0.2s; }
  .day-toggle.open { transform: rotate(180deg); }
  .day-body { display: none; padding: 0 14px 14px; }
  .day-body.open { display: block; }
  .exercise-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .exercise-table th { font-size: 0.68rem; color: #64748b; text-align: right; padding: 4px 6px; border-bottom: 1px solid #2d3748; }
  .exercise-table td { font-size: 0.78rem; padding: 6px 6px; border-bottom: 1px solid #1a2030; vertical-align: top; }
  .exercise-table tr:last-child td { border-bottom: none; }
  .ex-name { font-weight: 600; color: #e2e8f0; }
  .ex-note { font-size: 0.68rem; color: #64748b; margin-top: 2px; }
  .sets-badge { display: inline-block; background: #0f1117; border: 1px solid #334155; border-radius: 6px; padding: 2px 8px; font-size: 0.72rem; color: #34d399; white-space: nowrap; }
  .warmup-box { background: #1a2744; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.78rem; color: #93c5fd; line-height: 1.7; }
  .warmup-box strong { color: #60a5fa; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .info-card { background: #1e2535; border-radius: 12px; padding: 14px; border: 1px solid #2d3748; }
  .info-card h3 { font-size: 0.85rem; color: #34d399; margin-bottom: 10px; }
  .info-card ul { list-style: none; }
  .info-card li { font-size: 0.78rem; color: #cbd5e1; padding: 4px 0; border-bottom: 1px solid #1a2030; line-height: 1.4; }
  .info-card li:last-child { border-bottom: none; }
  .info-card li::before { content: "← "; color: #475569; }
  .tip-box { background: #1c2a1c; border: 1px solid #2d5a2d; border-radius: 10px; padding: 12px; font-size: 0.8rem; color: #86efac; margin-top: 14px; line-height: 1.7; }
  .tip-box strong { color: #34d399; }
  .progress-section { display: flex; flex-direction: column; gap: 10px; }
  .week-row { background: #1e2535; border-radius: 10px; padding: 12px 14px; }
  .week-row h4 { font-size: 0.82rem; color: #34d399; margin-bottom: 8px; }
  .week-days { display: flex; gap: 8px; flex-wrap: wrap; }
  .w-day { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .w-day span { font-size: 0.62rem; color: #64748b; }
  .w-dot { width: 30px; height: 30px; border-radius: 50%; background: #2d3748; border: 2px solid #334155; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: all 0.2s; }
  .w-dot.done { background: #34d399; border-color: #34d399; color: #0f1117; }
  .w-dot.rest { background: #1e2535; border: 2px dashed #334155; color: #475569; cursor: default; }
  .chest { background: #1e3a5f; color: #60a5fa; }
  .back { background: #1e3d2f; color: #34d399; }
  .legs { background: #3d2a1e; color: #f97316; }
  .shoulders { background: #3a1e3d; color: #c084fc; }
  .cardio { background: #2d1a1a; color: #f87171; }
  .rest-day { background: #1e2535; color: #64748b; }
</style>
</head>
<body>
