<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routine Hub — امین</title>
<style>
  :root {
    --bg: #080b12;
    --bg1: #0d1117;
    --bg2: #111827;
    --bg3: #1a2235;
    --border: #1e293b;
    --border2: #263044;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #475569;
    --blue: #60a5fa;
    --blue-d: #1e3a5f;
    --green: #34d399;
    --green-d: #1e3a2f;
    --orange: #f97316;
    --orange-d: #3d1a0a;
    --purple: #a78bfa;
    --purple-d: #2d1e4a;
    --yellow: #fbbf24;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text); direction: rtl; }

  /* ---- LAYOUT ---- */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---- HEADER ---- */
  .header {
    background: linear-gradient(135deg, #0f1f3d 0%, var(--bg1) 100%);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .header-title { font-size: 1rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
  .header-title span { color: var(--blue); }
  .header-date { font-size: 0.68rem; color: var(--text3); background: var(--bg3); padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); }
  .day-strip { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .day-strip::-webkit-scrollbar { display: none; }
  .day-btn {
    padding: 5px 13px; border-radius: 14px; border: 1px solid var(--border);
    background: transparent; color: var(--text3); cursor: pointer;
    font-size: 0.7rem; white-space: nowrap; transition: all 0.2s; flex-shrink: 0;
    font-family: inherit;
  }
  .day-btn.active { background: var(--blue-d); color: var(--blue); border-color: #2d5a8a; font-weight: 700; }
  .day-btn .today-dot { display: inline-block; width: 5px; height: 5px; background: var(--yellow); border-radius: 50%; margin-right: 3px; vertical-align: middle; }

  /* ---- CONTENT AREA ---- */
  .content-area { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .content-area::-webkit-scrollbar { width: 4px; }
  .content-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ---- PAGES ---- */
  .page { display: none; padding: 12px 14px 80px; }
  .page.active { display: block; }

  /* ---- BOTTOM NAV ---- */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg1); border-top: 1px solid var(--border);
    display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 10px 4px 8px; cursor: pointer; border: none; background: transparent;
    color: var(--text3); font-family: inherit; transition: all 0.2s; gap: 3px;
  }
  .nav-btn .nav-icon { font-size: 1.2rem; }
  .nav-btn .nav-label { font-size: 0.58rem; }
  .nav-btn.active { color: var(--blue); }
  .nav-btn.active .nav-icon { transform: translateY(-2px); }

  /* ---- SHARED COMPONENTS ---- */
  .card { background: var(--bg1); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 10px; }
  .card-header { padding: 10px 14px 0; display: flex; align-items: center; gap: 8px; }
  .card-header h2 { font-size: 0.72rem; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
  .card-body { padding: 8px 14px 12px; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat-card { background: var(--bg1); border-radius: 12px; border: 1px solid var(--border); padding: 10px 6px; text-align: center; }
  .stat-val { font-size: 1.1rem; font-weight: 800; }
  .stat-lbl { font-size: 0.56rem; color: var(--text3); margin-top: 2px; }

  /* ---- TIMELINE ---- */
  .timeline { display: flex; flex-direction: column; }
  .tblock { display: flex; align-items: stretch; position: relative; }
  .time-col { width: 50px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 5px 0; }
  .time-txt { font-size: 0.58rem; color: var(--text3); white-space: nowrap; }
  .time-line { flex: 1; width: 1px; background: var(--border); margin: 2px 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin: 4px 0; }
  .tblock-content { flex: 1; padding: 5px 10px 5px 5px; border-right: 2px solid transparent; margin: 2px 0; border-radius: 0 8px 8px 0; transition: background 0.15s; }
  .tblock-icon { font-size: 0.85rem; float: right; margin-left: 5px; }
  .tblock-title { font-size: 0.78rem; font-weight: 600; margin-bottom: 1px; }
  .tblock-desc { font-size: 0.65rem; color: var(--text2); line-height: 1.4; }
  .tblock-tag { display: inline-block; font-size: 0.56rem; padding: 1px 7px; border-radius: 8px; margin-top: 3px; background: var(--bg); border: 1px solid var(--border); color: var(--text2); }

  .c-wake  { border-color: var(--purple); } .c-wake  .dot { background: var(--purple); } .c-wake  .tblock-title { color: #c4b5fd; }
  .c-gym   { border-color: var(--orange); } .c-gym   .dot { background: var(--orange); } .c-gym   .tblock-title { color: #fb923c; }
  .c-food  { border-color: var(--yellow); } .c-food  .dot { background: var(--yellow); } .c-food  .tblock-title { color: #fde047; }
  .c-work  { border-color: var(--blue);   } .c-work  .dot { background: var(--blue);   } .c-work  .tblock-title { color: #93c5fd; }
  .c-buf   { border-color: var(--purple); } .c-buf   .dot { background: var(--purple); } .c-buf   .tblock-title { color: #c4b5fd; }
  .c-code  { border-color: var(--green);  } .c-code  .dot { background: var(--green);  } .c-code  .tblock-title { color: #6ee7b7; }
  .c-free  { border-color: var(--text3);  } .c-free  .dot { background: var(--text3);  } .c-free  .tblock-title { color: var(--text2); }
  .c-sleep { border-color: var(--blue-d); } .c-sleep .dot { background: #2d4a8a;      } .c-sleep .tblock-title { color: var(--blue); }

  /* ---- HABITS ---- */
  .habit-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--bg); }
  .habit-row:last-child { border-bottom: none; }
  .habit-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border2); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0; transition: all 0.2s; }
  .habit-check.done { background: var(--green); border-color: var(--green); color: var(--bg); font-weight: 700; }
  .habit-label { flex: 1; font-size: 0.76rem; }
  .habit-icon { font-size: 0.85rem; }

  /* ---- WEEK GRID ---- */
  .week-row-cal { display: flex; gap: 4px; }
  .week-day-cal { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .wdc-label { font-size: 0.56rem; color: var(--text3); }
  .wdc-dot { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 700; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; }
  .wdc-dot.today { border-color: var(--blue) !important; color: var(--blue) !important; }
  .wdc-dot.train-day { background: var(--green-d); color: var(--green); border-color: #2d5a3f; }
  .wdc-dot.cardio-day { background: #2a1e1e; color: var(--red); border-color: #5a2d2d; }
  .wdc-dot.rest-day { background: var(--bg3); color: var(--text3); }
  .wdc-dot.done-day { background: var(--green) !important; color: var(--bg) !important; border-color: var(--green) !important; }
  .wdc-type { font-size: 0.5rem; color: var(--text3); text-align: center; }

  /* ---- WORKOUT ---- */
  .warmup-box { background: #1a2744; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.76rem; color: #93c5fd; line-height: 1.7; }
  .warmup-box strong { color: var(--blue); }
  .ex-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--bg); }
  .ex-row:last-child { border-bottom: none; }
  .ex-num { font-size: 0.58rem; color: var(--text3); min-width: 16px; text-align: center; }
  .ex-name { flex: 1; font-size: 0.79rem; color: var(--text); font-weight: 500; }
  .ex-note-sm { font-size: 0.62rem; color: var(--text3); }
  .ex-sets { font-size: 0.68rem; background: var(--bg); border: 1px solid var(--border2); border-radius: 6px; padding: 2px 8px; color: var(--orange); white-space: nowrap; font-weight: 600; }
  .day-type-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 14px; border-radius: 12px; font-size: 0.78rem; font-weight: 700; margin-bottom: 12px; }
  .rest-block { text-align: center; padding: 28px 16px; }
  .rest-block .rest-emoji { font-size: 2.5rem; margin-bottom: 8px; }
  .rest-block h3 { font-size: 0.95rem; color: var(--purple); margin-bottom: 6px; }
  .rest-block p { font-size: 0.74rem; color: var(--text3); line-height: 1.7; }

  /* ---- NUTRITION ---- */
  .meal-card { background: var(--bg1); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
  .meal-header-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .meal-time-badge { font-size: 0.62rem; color: var(--text3); min-width: 42px; }
  .meal-icon { font-size: 1rem; }
  .meal-name { flex: 1; font-size: 0.86rem; font-weight: 600; }
  .meal-kcal { font-size: 0.65rem; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 2px 8px; color: var(--green); }
  .meal-body { padding: 8px 14px 10px; }
  .meal-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; padding: 4px 0; border-bottom: 1px solid var(--bg); }
  .meal-item:last-child { border-bottom: none; }
  .item-name { color: var(--text); }
  .item-macros { font-size: 0.63rem; color: var(--text3); }
  .macro-bar { display: flex; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .macro-pill { flex: 1; text-align: center; background: var(--bg); border-radius: 7px; padding: 5px 2px; }
  .macro-pill .val { font-size: 0.8rem; font-weight: 700; }
  .macro-pill .lbl { font-size: 0.56rem; color: var(--text3); margin-top: 1px; }
  .p-col { color: var(--green); }
  .c-col { color: var(--yellow); }
  .f-col { color: var(--orange); }
  .k-col { color: var(--purple); }

  .day-type-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .dtype-btn { padding: 5px 12px; border-radius: 16px; border: 1px solid var(--border2); background: transparent; color: var(--text3); cursor: pointer; font-size: 0.72rem; transition: all 0.2s; font-family: inherit; }
  .dtype-btn.active { background: var(--green-d); color: var(--green); border-color: var(--green); }

  .daily-total-card { background: linear-gradient(135deg, #0f1f3d, var(--bg1)); border: 1px solid var(--blue-d); border-radius: 14px; padding: 14px; margin-top: 6px; margin-bottom: 10px; }
  .daily-total-card h3 { font-size: 0.78rem; color: var(--blue); margin-bottom: 10px; font-weight: 700; }
  .total-row { display: flex; gap: 7px; }
  .total-pill { flex: 1; text-align: center; background: var(--bg); border-radius: 10px; padding: 9px 3px; }
  .total-pill .big { font-size: 1rem; font-weight: 800; }
  .total-pill .sm { font-size: 0.58rem; color: var(--text3); margin-top: 2px; }
  .prog-wrap { margin-top: 10px; }
  .prog-label { display: flex; justify-content: space-between; font-size: 0.63rem; color: var(--text3); margin-bottom: 3px; margin-top: 6px; }
  .prog-bar-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 3px; transition: width 0.6s; }

  /* ---- SHOP ---- */
  .shop-summary { display: flex; gap: 8px; margin-bottom: 12px; }
  .shop-stat { flex: 1; background: var(--bg1); border-radius: 10px; padding: 8px; text-align: center; border: 1px solid var(--border); }
  .shop-stat .sv { font-size: 0.95rem; font-weight: 700; color: var(--green); }
  .shop-stat .sl { font-size: 0.58rem; color: var(--text3); margin-top: 1px; }
  .shop-filter { display: flex; gap: 6px; margin-bottom: 12px; }
  .sf-btn { flex: 1; padding: 7px 8px; border-radius: 10px; border: 1px solid var(--border2); background: transparent; color: var(--text3); cursor: pointer; font-size: 0.72rem; font-family: inherit; transition: all 0.2s; text-align: center; }
  .sf-btn.active { border-color: var(--blue); color: var(--blue); background: var(--blue-d); }
  .shop-cat { background: var(--bg1); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
  .shop-cat-hdr { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg3); }
  .shop-cat-hdr .icon { font-size: 1rem; }
  .shop-cat-hdr .name { flex: 1; font-size: 0.84rem; font-weight: 700; }
  .shop-cat-hdr .count { font-size: 0.63rem; color: var(--text3); }
  .shop-item { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--bg); cursor: pointer; transition: background 0.15s; }
  .shop-item:last-child { border-bottom: none; }
  .shop-item:hover { background: var(--bg3); }
  .shop-chk { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; color: var(--bg); font-weight: 700; transition: all 0.2s; }
  .shop-chk.done { background: var(--green); border-color: var(--green); }
  .shop-info { flex: 1; }
  .shop-info .sn { font-size: 0.8rem; color: var(--text); }
  .shop-info .ss { font-size: 0.63rem; color: var(--text3); margin-top: 1px; }
  .shop-item.crossed .sn { text-decoration: line-through; color: var(--text3); }
  .store-tag { display: inline-block; font-size: 0.56rem; padding: 1px 5px; border-radius: 5px; margin-right: 4px; }
  .store-aldi { background: #1a2744; color: #60a5fa; }
  .store-rewe { background: #2a1a1a; color: #f87171; }
  .shop-price { font-size: 0.68rem; color: var(--text3); }
  .shop-amount { font-size: 0.7rem; font-weight: 600; color: var(--purple); white-space: nowrap; }

  .cost-box { background: linear-gradient(135deg, #0f1f3d, var(--bg1)); border: 1px solid var(--blue-d); border-radius: 14px; padding: 14px; margin-top: 4px; margin-bottom: 10px; }
  .cost-row { display: flex; justify-content: space-between; font-size: 0.76rem; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .cost-row:last-child { border-bottom: none; }
  .cost-row .cn { color: var(--text2); }
  .cost-row .cv { color: var(--green); }
  .cost-row.total .cn, .cost-row.total .cv { font-weight: 700; font-size: 0.84rem; color: var(--text); }

  /* ---- TIP / NOTE ---- */
  .tip-box { background: var(--green-d); border: 1px solid #2d5a2d; border-radius: 10px; padding: 10px 12px; font-size: 0.74rem; color: #86efac; line-height: 1.7; margin-bottom: 8px; }
  .tip-box strong { color: var(--green); }
  .warn-box { background: #2a1a1a; border: 1px solid #5a2d2d; border-radius: 10px; padding: 10px 12px; font-size: 0.74rem; color: #fca5a5; line-height: 1.7; margin-bottom: 8px; }
  .warn-box strong { color: var(--red); }
  .info-box { background: var(--blue-d); border: 1px solid #2d5a8a; border-radius: 10px; padding: 10px 12px; font-size: 0.74rem; color: #93c5fd; line-height: 1.7; margin-bottom: 8px; }

  /* ---- SECTION LABEL ---- */
  .section-label { font-size: 0.65rem; font-weight: 700; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 0 5px; }

  /* ---- DIVIDER ---- */
  .divider { height: 1px; background: var(--border); margin: 4px 0 10px; }

  /* ---- PRINCIPLE ROW ---- */
  .principle { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--bg); font-size: 0.76rem; line-height: 1.5; }
  .principle:last-child { border-bottom: none; }
  .principle .pi { font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
  .principle .pt { color: var(--text2); }
  .principle .pt strong { color: var(--text); }

  /* Progress done button */
  .done-btn { width: 100%; padding: 10px; border-radius: 10px; border: 1px dashed var(--green); background: transparent; color: var(--green); cursor: pointer; font-size: 0.78rem; font-family: inherit; transition: all 0.2s; margin-top: 4px; }
  .done-btn:hover, .done-btn.done { background: var(--green-d); }

  /* Responsive */
  @media (max-width: 380px) {
    .stats-row { grid-template-columns: repeat(4,1fr); gap: 5px; }
    .stat-val { font-size: 0.95rem; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="header-title">Routine <span>Hub</span></div>
      <div class="header-date" id="headerDate"></div>
    </div>
    <div class="day-strip" id="dayStrip"></div>
  </div>

  <!-- CONTENT -->
  <div class="content-area" id="contentArea">

    <!-- PAGE: DASHBOARD -->
    <div class="page active" id="page-dash">
      <div class="stats-row" id="statsRow"></div>
      <div class="card">
        <div class="card-header"><h2>⏱ برنامه ساعتی امروز</h2></div>
        <div class="card-body" style="padding-top:10px">
          <div class="timeline" id="timeline"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h2>✅ چک‌لیست روزانه</h2></div>
        <div class="card-body" id="habitsBody"></div>
      </div>
      <div class="card">
        <div class="card-header"><h2>📅 هفته جاری</h2></div>
        <div class="card-body" id="weekBody"></div>
      </div>
      <div class="card">
        <div class="card-header"><h2>💻 بلوک کدنویسی — ۱۶:۳۰–۱۸:۳۰</h2></div>
        <div class="card-body" id="codeBody"></div>
      </div>
    </div>

    <!-- PAGE: WORKOUT -->
    <div class="page" id="page-workout">
      <div id="workoutContent"></div>
    </div>

    <!-- PAGE: NUTRITION -->
    <div class="page" id="page-nutrition">
      <div class="day-type-tabs" id="nutritionTabs">
        <button class="dtype-btn active" onclick="setNutritionType('train',this)">💪 روز تمرین</button>
        <button class="dtype-btn" onclick="setNutritionType('cardio',this)">🏃 روز کاردیو</button>
        <button class="dtype-btn" onclick="setNutritionType('rest',this)">😴 روز استراحت</button>
        <button class="dtype-btn" onclick="setNutritionType('office',this)">🏢 کانتین</button>
      </div>
      <div id="nutritionContent"></div>
    </div>

    <!-- PAGE: SHOP -->
    <div class="page" id="page-shop">
      <div class="shop-summary">
        <div class="shop-stat"><div class="sv" id="shopChecked">0</div><div class="sl">تیک‌زده</div></div>
        <div class="shop-stat"><div class="sv" id="shopTotal">0</div><div class="sl">کل اقلام</div></div>
        <div class="shop-stat"><div class="sv">~€50</div><div class="sl">هزینه هفتگی</div></div>
      </div>
      <div class="shop-filter">
        <button class="sf-btn active" onclick="setShopFilter('all',this)">🛒 همه</button>
        <button class="sf-btn" onclick="setShopFilter('aldi',this)">🔵 Aldi/Lidl</button>
        <button class="sf-btn" onclick="setShopFilter('rewe',this)">🔴 Rewe/Edeka</button>
      </div>
      <div id="shopContent"></div>
      <div class="cost-box" id="costBox">
        <div class="cost-row"><span class="cn">پروتئین (مرغ، ماهی، تخم‌مرغ)</span><span class="cv">~€18–22</span></div>
        <div class="cost-row"><span class="cn">لبنیات (Quark، Skyr، Hüttenkäse)</span><span class="cv">~€8–10</span></div>
        <div class="cost-row"><span class="cn">کربوهیدرات (جو، نان، برنج)</span><span class="cv">~€5–7</span></div>
        <div class="cost-row"><span class="cn">میوه و سبزیجات</span><span class="cv">~€8–10</span></div>
        <div class="cost-row total"><span class="cn">جمع کل تخمینی</span><span class="cv">~€44–56</span></div>
      </div>
      <button onclick="resetShop()" style="width:100%;padding:9px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;font-size:0.74rem;font-family:inherit;margin-bottom:10px">🔄 پاک کردن لیست</button>
    </div>

  </div><!-- end content-area -->

const jsDay = new Date().getDay();

// ==================== UTILS ====================
function getDayType(day) {
  if (day.type === 'rest' || day.type === 'rest-full') return 'rest';
  return day.type;
}

function getTimelineType(day) {
  const t = day.type;
  if (t === 'rest' || t === 'rest-full') return 'rest';
  if (t === 'cardio') return 'cardio';
  return 'train';
}

// ==================== HEADER ====================
function renderHeader() {
  const now = new Date();
  const opts = { weekday:'short', day:'numeric', month:'short' };
  document.getElementById('headerDate').textContent = now.toLocaleDateString('de-DE', opts);

  const strip = document.getElementById('dayStrip');
  strip.innerHTML = '';
  DAYS.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (i === currentDay ? ' active' : '');
    const isToday = i === todayIdx;
    btn.innerHTML = (isToday ? '<span class="today-dot"></span>' : '') + `${d.de} <span style="opacity:0.55;font-size:0.62rem">${d.fa}</span>`;
    btn.onclick = () => { currentDay = i; renderAll(); };

  });

// ==================== SHOP ====================
function setShopFilter(filter, btn) {
  shopFilter = filter;
  document.querySelectorAll('.sf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderShop();
}

function renderShop() {
  const el = document.getElementById('shopContent');
  let totalItems = 0, checkedItems = 0;
  let html = '';

  SHOP_CATS.forEach((cat, ci) => {
    const filtered = shopFilter === 'all' ? cat.items : cat.items.filter(i => i.store === shopFilter);
    if (!filtered.length) return;
    totalItems += filtered.length;
    const done = filtered.filter(item => shopState[`${ci}-${cat.items.indexOf(item)}`]).length;
    checkedItems += done;

    html += `<div class="shop-cat">
      <div class="shop-cat-hdr">
        <span class="icon">${cat.icon}</span>
        <span class="name">${cat.name}</span>
        <span class="count">${done}/${filtered.length} ${done===filtered.length && filtered.length>0?'✅':''}</span>
      </div>`;

    filtered.forEach(item => {
      const oi = cat.items.indexOf(item);
      const key = `${ci}-${oi}`;
      const isDone = shopState[key];
      const storeTag = item.store === 'aldi'
        ? '<span class="store-tag store-aldi">Aldi/Lidl</span>'
        : '<span class="store-tag store-rewe">Rewe/Edeka</span>';
      html += `<div class="shop-item ${isDone?'crossed':''}" onclick="toggleShop('${ci}','${oi}')">
        <div class="shop-chk ${isDone?'done':''}">${isDone?'✓':''}</div>
        <div class="shop-info">
          <div class="sn">${item.name}</div>
          <div class="ss">${item.sub} ${storeTag}</div>
        </div>
        <span class="shop-price">${item.price}</span>
        <span class="shop-amount">${item.amount}</span>
      </div>`;
    });

    html += `</div>`;
  });

  el.innerHTML = html;
  document.getElementById('shopChecked').textContent = checkedItems;
  document.getElementById('shopTotal').textContent = totalItems;
}

function toggleShop(ci, oi) {
  const key = `${ci}-${oi}`;
  shopState[key] = !shopState[key];
  renderShop();
}

function resetShop() {
  Object.keys(shopState).forEach(k => delete shopState[k]);
  renderShop();
}

// ==================== INTERACTIONS ====================
function toggleHabit(dayIdx, hi) {
  const key = `${dayIdx}-${hi}`;
  habitState[key] = !habitState[key];
  renderHabits();
}

function toggleDayDone(i) {
  dayDoneState[i] = !dayDoneState[i];
  renderWeek();
}

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
  document.getElementById('contentArea').scrollTop = 0;
}

// ==================== RENDER ALL ====================
function renderAll() {
  renderHeader();
  renderStats();
  renderTimeline();
  renderHabits();
  renderWeek();
  renderCodeBlock();
  renderWorkout();
  renderNutrition();
  renderShop();
}

// Set nutrition type based on current day
function initNutritionTab() {
  const t = getTimelineType(DAYS[currentDay]);
  nutritionType = t === 'cardio' ? 'cardio' : t === 'rest' ? 'rest' : 'train';
  document.querySelectorAll('.dtype-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['train','cardio','rest','office'][i] === nutritionType);
  });
}

initNutritionTab();
renderAll();
</script>
